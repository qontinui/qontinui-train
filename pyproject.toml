[tool.poetry]
name = "qontinui-train"
version = "0.1.0"
description = "ML training infrastructure for Qontinui"
authors = ["Joshua Spinak <jspinak@hotmail.com>"]
readme = "README.md"
packages = [{include = "qontinui_train", from = "."}]

[tool.poetry.dependencies]
python = ">=3.12,<3.14.1 || >3.14.1,<3.15"
torch = "^2.2"
torchvision = "^0.26"
opencv-python = "^4.8.0"
numpy = "^2.0"
pillow = ">=13.0.0,<14.0.0"
tensorboard = "^2.14.0"
pyyaml = "^6.0"
# ButtonYOLO's default model_type is "yolov8", and its constructor always loads a
# model, so the default path needs ultralytics. qontinui core moved ultralytics into
# its optional [ml] extra, which this path dependency does not request; depending on
# qontinui[ml] would pull in core's whole ML stack, so train declares it directly.
ultralytics = "^8.4"
qontinui = {path = "../qontinui", develop = true}
qontinui-schemas = {path = "../qontinui-schemas", develop = true}

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"  # floor: CVE-2025-71176 (insecure temporary directory)
ruff = "^0.14"
mypy = "^1.14"
pre-commit = "^4.4"

# Security floors for TRANSITIVE dependencies. The first nine are copied from the
# `security-floors` group in qontinui/pyproject.toml; keep them in step with it.
# Poetry does not pass a path dependency's groups on to its consumers, so core's
# floors never reach this lock unless they are restated here. Poetry 2's `poetry
# lock` keeps an already-locked version while it still satisfies every constraint,
# so a fixed release is never picked up unless something forces it. These floors
# force it and stop a later re-lock regressing below the fix. The group is optional,
# so nothing here is installed by default or becomes a runtime requirement of
# qontinui-train. Every group is resolved into poetry.lock, so the floors still bind
# the locked versions. Floors only, no upper bounds. Residue, not floorable here:
# setuptools (torch 2.11 requires <82) and torch itself (CVE-2025-3000, fixed in
# 2.13), because torchvision ^0.26 above, aligned with qontinui, holds torch at
# 2.11. Both are recorded in .trivyignore.
[tool.poetry.group.security-floors]
optional = true

[tool.poetry.group.security-floors.dependencies]
anyio = ">=4.14.2"
certifi = ">=2026.10.18"
filelock = ">=4.2.1"
fsspec = ">=2026.6.0"
h2 = ">=4.4.1"
multidict = ">=6.9.1"
ujson = ">=5.13.0"  # no other package in this lock depends on ujson; this floor alone adds it (security-floors group only), kept so the list stays identical to core's
urllib3 = ">=2.8.0"
virtualenv = ">=21.14.9"  # filelock 4 needs virtualenv 21.10.0 or newer (earlier releases cap filelock <4)
# Train-specific floors, beyond core's nine. Core has no werkzeug, and its own lock
# already sits at the idna and pygments fixes, but a path dependency's locked
# versions do not reach this lock any more than its groups do.
idna = ">=3.15"  # CVE-2026-45409; via anyio, httpx, requests, trio and yarl
pygments = ">=2.20.0"  # CVE-2026-4539; dev only, via pytest
werkzeug = ">=3.1.9"  # CVE-2026-102598; via tensorboard, a train-only dependency

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
